---
name: Nod image
on:
  workflow_dispatch:
  push:
    branches: [feat/nod-image]
    paths:
      - .github/workflows/nod-image.yaml
      - .github/nod/**
permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.image-artifact.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout Nod v0.9.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: n8n-io/nod
          ref: 6cebbf1a448eba950d97e907bef8435e3a4e8b33
          path: nod-upstream
          persist-credentials: false
      - name: Fetch verified Docker CLI license texts
        run: |
          set -euo pipefail
          mkdir -p nod-upstream/docker-cli-licenses
          base=https://raw.githubusercontent.com/docker/cli/fdd4b8e5da335e1d0d83d29af5045f57280cd694
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 "$base/LICENSE" -o nod-upstream/docker-cli-licenses/LICENSE
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 "$base/NOTICE" -o nod-upstream/docker-cli-licenses/NOTICE
          printf '%s  %s\n' \
            2d81ea060825006fc8f3fe28aa5dc0ffeb80faf325b612c955229157b8c10dc0 nod-upstream/docker-cli-licenses/LICENSE \
            a8c869fbda819afb8d80e0ac19bac52e766bc6c19cb38cf94f52d64c4be2aab6 nod-upstream/docker-cli-licenses/NOTICE | sha256sum --check
      # Pin upstream inputs and package the corresponding license and source material.
      - name: Prepare pinned build and licenses
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path('nod-upstream/deployment/self-host/Dockerfile')
          source = path.read_text()
          old = 'node:24.21.0-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20'
          new = 'node:24.22.3-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54'
          assert source.count(old) == 2
          source = source.replace(old, new)
          old = 'docker:29.8.2-cli@sha256:35cfcf893c20f2931f4909151b5407aaaeab711277de7ce8b8f521f095d54c32'
          new = 'docker:29.10.0-cli@sha256:34507eb5069d8be82c95dd3b6987d4250fd5fee49b82e2509b7d7a7030740d6d'
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = 'apt-get install -y --no-install-recommends ca-certificates '
          new = 'apt-get install -y --no-install-recommends ca-certificates=20250419~deb12u2 '
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = 'COPY src ./src'
          new = old + "\nCOPY desktop/scripts/speech-sources.mjs ./desktop/scripts/speech-sources.mjs\nCOPY desktop/licenses/speech.md ./desktop/licenses/speech.md\nRUN node --input-type=module -e \"import { copySpeechSources } from './desktop/scripts/speech-sources.mjs'; await copySpeechSources({ root: '/app', target: '/app' })\""
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = 'COPY --chown=node:node docs/src/content/docs ./docs/src/content/docs'
          new = old + '\nCOPY --chown=node:node LICENSE NOTICE ./licenses/\nCOPY --chown=node:node docker-cli-licenses/ ./licenses/docker-cli/\nCOPY --from=build --chown=node:node /app/licenses/speech ./licenses/speech/\nCOPY --from=build --chown=node:node /app/desktop/licenses/speech.md ./desktop/licenses/speech.md'
          assert source.count(old) == 1
          path.write_text(source.replace(old, new))
          ignore = Path('nod-upstream/.dockerignore')
          exclusions = ignore.read_text()
          assert exclusions.startswith('*\n')
          assert '!LICENSE\n' not in exclusions and '!desktop/\n' not in exclusions
          ignore.write_text(exclusions + '\n!LICENSE\n!NOTICE\n!desktop/\n!desktop/scripts/\n!desktop/scripts/speech-sources.mjs\n!desktop/licenses/\n!desktop/licenses/speech.md\n!docker-cli-licenses/\n!docker-cli-licenses/LICENSE\n!docker-cli-licenses/NOTICE\n')
          PYCODE
      - name: Build upstream self-host image
        run: docker build --file nod-upstream/deployment/self-host/Dockerfile --tag nod-test:local nod-upstream
      - name: Smoke test isolated server
        run: bash .github/nod/smoke.sh
      - name: Save tested image
        run: docker save nod-test:local --output nod-image.tar
      - name: Upload tested image
        id: image-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nod-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: nod-image.tar
          retention-days: 1
          compression-level: 0

  publish:
    if: github.repository == 'ciel-shieru/Biohazard' && github.ref == 'refs/heads/feat/nod-image'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Download tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
      - name: Load tested image
        run: docker load --input nod-image.tar
      - name: Publish tested image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY_OWNER,,}/nod-server:nod-v0.9.0"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REPOSITORY_OWNER" --password-stdin
          docker tag nod-test:local "$image"
          docker push "$image"
