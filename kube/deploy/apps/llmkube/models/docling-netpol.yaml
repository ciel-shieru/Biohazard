---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: docling-serve
  namespace: llmkube
spec:
  endpointSelector:
    matchLabels:
      inference.llmkube.dev/service: docling-serve
  ingress:
    # The ToolHive MCP workload is the only Docling-specific HTTP client.
    # LLMKube's common policy also permits its existing trusted operator/router.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp
            docling.internal/role: mcp
      toPorts:
        - ports:
            - port: "5001"
              protocol: TCP
  # Only permit Docling's admin-defined VLM API destination. The existing
  # clusterwide rule handles kube-dns; there is no world or host egress.
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: llmkube
            inference.llmkube.dev/model-router: llmkube-router
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
