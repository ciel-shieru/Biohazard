---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: docling-serve
  namespace: llmkube
spec:
  endpointSelector:
    matchLabels:
      inference.llmkube.dev/service: docling-serve
  ingress:
    # The ToolHive MCP workload is the only Docling-specific HTTP client.
    # LLMKube's common policy also permits its existing trusted operator/router.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp
            docling.internal/role: mcp
      toPorts:
        - ports:
            - port: "5001"
              protocol: TCP
  # The cluster's default DNS-egress CiliumClusterwideNetworkPolicy and
  # any future app/global allow rules are additive. An empty egress allowlist
  # alone is NOT a sufficient zero-egress guarantee. Deny takes precedence
  # over every allow policy, including DNS, in-cluster, node and world peers.
  egress: []
  egressDeny:
    - toEntities:
        - all
