# Request a daily Qwen llama.cpp restart. The LLMKube controller gates the
# resulting pod-template rollout on the runtime's native /slots idle check.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qwen3.6-35b-a3b-restart
  namespace: llmkube
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qwen3.6-35b-a3b-restart
  namespace: llmkube
rules:
  - apiGroups:
      - inference.llmkube.dev
    resources:
      - inferenceservices
    resourceNames:
      - qwen3.6-35b-a3b
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qwen3.6-35b-a3b-restart
  namespace: llmkube
subjects:
  - kind: ServiceAccount
    name: qwen3.6-35b-a3b-restart
    namespace: llmkube
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qwen3.6-35b-a3b-restart
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qwen3.6-35b-a3b-restart
  namespace: llmkube
  labels:
    app.kubernetes.io/name: qwen3.6-35b-a3b-restart
spec:
  schedule: "0 1 * * *"
  timeZone: Asia/Singapore
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: qwen3.6-35b-a3b-restart
            egress.home.arpa/apiserver: allow
        spec:
          serviceAccountName: qwen3.6-35b-a3b-restart
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: patch-inferenceservice
              # Reuse the digest-pinned kubectl image already used in this repository.
              image: registry.k8s.io/kubectl:v1.37.2@sha256:fe049faa65ae483ac200009a949a68fa4c9985daea12c9cb1195c9c7965301fc
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  # Use the UTC date as an idempotent daily marker. At 01:00
                  # Singapore time it is the preceding UTC calendar date.
                  restart_day="$(date -u +%Y-%m-%d)"
                  patch="$(printf '{"spec":{"podAnnotations":{"ops.home.arpa/daily-restart":"%s"}}}' "$restart_day")"
                  kubectl --namespace llmkube patch inferenceservice qwen3.6-35b-a3b \
                    --type merge \
                    --patch "$patch"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
