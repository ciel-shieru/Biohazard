# Request a daily Qwen llama.cpp restart. The LLMKube controller gates the
# resulting pod-template rollout on the runtime's native /slots idle check.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qwen3.6-35b-a3b-restart
  namespace: llmkube
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qwen3.6-35b-a3b-restart
  namespace: llmkube
rules:
  - apiGroups:
      - inference.llmkube.dev
    resources:
      - inferenceservices
    resourceNames:
      - qwen3.6-35b-a3b
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qwen3.6-35b-a3b-restart
  namespace: llmkube
subjects:
  - kind: ServiceAccount
    name: qwen3.6-35b-a3b-restart
    namespace: llmkube
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qwen3.6-35b-a3b-restart
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qwen3.6-35b-a3b-restart
  namespace: llmkube
  labels:
    app.kubernetes.io/name: qwen3.6-35b-a3b-restart
spec:
  schedule: "0 1 * * *"
  timeZone: Asia/Singapore
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: qwen3.6-35b-a3b-restart
            egress.home.arpa/apiserver: allow
        spec:
          serviceAccountName: qwen3.6-35b-a3b-restart
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: patch-inferenceservice
              image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  token_path=/var/run/secrets/kubernetes.io/serviceaccount/token
                  ca_path=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  restart_day="$(date -u +%Y-%m-%d)"
                  patch="$(printf '{"spec":{"podAnnotations":{"ops.home.arpa/daily-restart":"%s"}}}' "$restart_day")"

                  curl \
                    --proto '=https' \
                    --tlsv1.2 \
                    --cacert "$ca_path" \
                    --header "Authorization: Bearer $(cat "$token_path")" \
                    --header "Content-Type: application/merge-patch+json" \
                    --request PATCH \
                    --data-binary "$patch" \
                    --connect-timeout 5 \
                    --max-time 30 \
                    --retry 2 \
                    --retry-connrefused \
                    --retry-delay 2 \
                    --fail \
                    --silent \
                    --show-error \
                    --output /dev/null \
                    --write-out 'InferenceService patch returned HTTP %{http_code}\n' \
                    "https://kubernetes.default.svc/apis/inference.llmkube.dev/v1alpha1/namespaces/llmkube/inferenceservices/qwen3.6-35b-a3b"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
