---
# Docling's layout, TableFormer and OCR engines are not standalone OpenAI-model
# endpoints. Run the official image that bundles their pinned weights as one
# LLMKube-managed generic inference workload; use LLMKube's router only for
# remote VLM picture descriptions.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: docling-bundled-models
  namespace: llmkube
spec:
  # Generic InferenceServices require a ModelRef. This is a version-pinned
  # upstream metadata identity, NOT the source of the runtime's weights:
  # skipModelInit below intentionally uses the models baked into the immutable
  # Docling Serve image. Do not enable prefetch/stageModel on this reference.
  source: hf://docling-project/docling-models@2199320848bb9a8a519d22e4b528185a4f9a6f64
  files:
    - config.json
  format: custom
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: docling-serve
  namespace: llmkube
spec:
  modelRef: docling-bundled-models
  runtime: generic
  # Docling Serve 1.38.2 / CUDA 12.8; includes local specialized models.
  image: ghcr.io/docling-project/docling-serve-cu128:v1.38.2@sha256:f26a8dea114dfcfdebcd1617a9eb0a66f48351ff8b5140510d3bfc989c74c38d
  # The specialized models are embedded in the digest-pinned image. Avoid
  # redundant downloads and never fetch model weights at request time.
  skipModelInit: true
  command: [docling-serve]
  args: [run]
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: sinon
  tolerations:
    - key: llm.internal
      operator: Exists
      effect: NoSchedule
  podLabels:
    docling.internal/role: serve
    ai.internal/llmkube: allow
  endpoint:
    type: ClusterIP
    port: 5001
  containerPort: 5001
  resources:
    gpu: 1
    cpu: "2"
    memory: 4Gi
    memoryLimit: 12Gi
  startupTimeout: 45m
  env:
    - name: TZ
      value: Asia/Singapore
    - name: CUDA_DEVICE_ORDER
      value: PCI_BUS_ID
    - name: DOCLING_DEVICE
      value: cuda:0
    - name: UVICORN_HOST
      value: 0.0.0.0
    - name: UVICORN_PORT
      value: "5001"
    - name: UVICORN_WORKERS
      value: "1"
    - name: UVICORN_PROXY_HEADERS
      value: "false"
    - name: DOCLING_SERVE_ENG_KIND
      value: local
    - name: DOCLING_SERVE_ENG_LOC_NUM_WORKERS
      value: "1"
    - name: DOCLING_SERVE_ENG_LOC_SHARE_MODELS
      value: "true"
    - name: DOCLING_SERVE_OPTIONS_CACHE_SIZE
      value: "1"
    - name: DOCLING_NUM_THREADS
      value: "2"
    - name: DOCLING_PERF_PAGE_BATCH_SIZE
      value: "1"
    - name: DOCLING_SERVE_LOAD_MODELS_AT_BOOT
      value: "true"
    - name: DOCLING_SERVE_LOG_FORMAT
      value: json
    - name: DOCLING_SERVE_ENABLE_UI
      value: "false"
    - name: DOCLING_SERVE_ENABLE_API_DOCS
      value: "false"
    - name: DOCLING_SERVE_ENABLE_MANAGEMENT_ENDPOINTS
      value: "false"
    - name: DOCLING_SERVE_DEBUG_ERROR_DETAILS
      value: "false"
    - name: DOCLING_SERVE_ALLOW_EXTERNAL_PLUGINS
      value: "false"
    - name: DOCLING_SERVE_ALLOW_CUSTOM_PICTURE_DESCRIPTION_CONFIG
      value: "false"
    # This enables only the admin-defined in-cluster API backend; Cilium
    # separately blocks external/metadata network access from this pod.
    - name: DOCLING_SERVE_ENABLE_REMOTE_SERVICES
      value: "true"
    - name: DOCLING_SERVE_CORS_ORIGINS
      value: '[]'
    - name: DOCLING_SERVE_MAX_FILE_SIZE
      value: "104857600"
    - name: DOCLING_SERVE_MAX_NUM_PAGES
      value: "128"
    - name: DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT
      value: "7200"
    - name: DOCLING_SERVE_MAX_SYNC_WAIT
      value: "7200"
    - name: DOCLING_SERVE_SINGLE_USE_RESULTS
      value: "true"
    - name: DOCLING_SERVE_SCRATCH_PATH
      value: /tmp/docling
    - name: DOCLING_SERVE_DEFAULT_PICTURE_DESCRIPTION_PRESET
      value: auto-vision
    - name: DOCLING_SERVE_ALLOWED_PICTURE_DESCRIPTION_PRESETS
      value: auto-vision
    - name: DOCLING_SERVE_ALLOWED_PICTURE_DESCRIPTION_ENGINES
      value: api
    # No Authorization header, OPENAI_API_KEY or other secret: the LLMKube
    # router accepts in-cluster callers opted in by Cilium pod label.
    - name: DOCLING_SERVE_CUSTOM_PICTURE_DESCRIPTION_PRESETS
      value: >-
        {"auto-vision":{"model_spec":{"name":"auto-vision","prompt":"Describe this visual precisely. Include all legible text, labels, values, axes, legends, layout relationships, chart data, diagram connections and fine details. Report uncertainty rather than inventing content."},"engine_options":{"engine_type":"api","url":"http://llmkube.llmkube.svc.cluster.local/v1/chat/completions","headers":{},"params":{"model":"auto-vision","max_tokens":2048,"temperature":0},"timeout":7200.0,"concurrency":1},"picture_area_threshold":0.0,"scale":2.0}}
    - name: HF_HUB_OFFLINE
      value: "1"
  extraVolumes:
    - name: tmp
      emptyDir:
        sizeLimit: 2Gi
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp
  probeOverrides:
    startup:
      httpGet:
        path: /ready
        port: 5001
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 270
    readiness:
      httpGet:
        path: /ready
        port: 5001
      periodSeconds: 10
      timeoutSeconds: 5
    liveness:
      httpGet:
        path: /health
        port: 5001
      periodSeconds: 30
      timeoutSeconds: 5
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
