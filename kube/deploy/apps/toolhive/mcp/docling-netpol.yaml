---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: docling-mcp-to-serve
  namespace: mcp
spec:
  endpointSelector:
    matchLabels:
      docling.internal/role: mcp
  egress:
    # Do not allow arbitrary external URI fetches or cloud API calls by the
    # document-accessing MCP process. Conversion occurs on the backend.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: llmkube
            inference.llmkube.dev/service: docling-serve
      toPorts:
        - ports:
            - port: "5001"
              protocol: TCP
    # MCP-side VLM call only. InferenceService egress remains deny-all.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: llmkube
            inference.llmkube.dev/model-router: llmkube-router
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
