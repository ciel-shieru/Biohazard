---
# yaml-language-server: $schema=https://crds.jank.ing/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name cryptpad-secrets
  namespace: cryptpad
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1p
  dataFrom:
    - extract:
        key: "CryptPad - ${CLUSTER_NAME}"
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: *name
    template:
      type: Opaque
      data:
        config.js: |
          module.exports = {
              maxWorkers: {
                  core: 1,
                  storage: 1,
                  "storage-http": 1,
                  http: 1,
              },
              maxJobs: {
                  core: 10,
                  storage: 10,
                  "storage-http": 10,
                  http: 10,
              },
              otpSessionExpiration: 7*24, // hours
              enforceMFA: false, // SSO
              logIP: true, // internal use only, so no public IPs logged
              adminKeys: [],
              inactiveTime: 180, // days
              archiveRetentionTime: 30, // days
              maxUploadSize: 100 * 1024 * 1024, // 100MB
              filePath: './datastore/',
              archivePath: './data/archive',
              pinPath: './data/pins',
              taskPath: './data/tasks',
              blockPath: './block',
              blobPath: './blob',
              blobStagingPath: './data/blobstage',
              decreePath: './data/decrees',
              logPath: '', // disable logging to disk
              logToStdout: true,
              logLevel: 'feedback', // feedback + info and below
              logFeedback: true,
              verbose: false,
          };
        infra.js: |
          module.exports = {
              public: {
                  origin: 'https://{{ .APP_DNS_CRYPTPAD }}',
                  sandboxOrigin: 'https://{{ .APP_DNS_CRYPTPAD_SAFE }}',
                  httpHost: '0.0.0.0',
                  httpPort: 3000,
                  httpSafePort: 3001,
                  externalWebsocketURL: undefined,
                  fileHost: undefined,
                  httpServerId: '',
              },
              front: [
                  {
                      host: '127.0.0.1',
                      port: 3010,
                  },
              ],
              core: [
                  {
                      host: '127.0.0.1',
                      port: 3020,
                  },
              ],
              storage: [
                  {
                      host: '127.0.0.1',
                      port: 3030,
                      wsPort: 3040,
                  },
              ],
          };
        sso.js: |
          module.exports = {
              enabled: true,
              enforced: true,
              cpPassword: true,
              forceCpPassword: false,
              list: [
              {
                  name: 'JJGadgets Auth',
                  type: 'oidc',
                  url: 'https://${APP_DNS_AUTHENTIK}/application/o/cryptpad/',
                  client_id: '{{ .AUTHENTIK_CLIENT_ID }}',
                  client_secret: '{{ .AUTHENTIK_CLIENT_SECRET }}',
                  jwt_alg: 'RS256',
                  username_scope: 'profile',
                  username_claim: 'preferred_username',
              }
              ]
          };
