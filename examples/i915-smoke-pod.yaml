---
apiVersion: v1
kind: Pod
metadata:
  name: gvisor-i915-smoke
  namespace: default
spec:
  runtimeClassName: gvisor-i915
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    supplementalGroups:
      - 44 # Talos udev rule assigns DRM devices to GID 44.
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: registry.example.com/i915-smoke@sha256:REPLACE_WITH_REAL_64_HEX_DIGEST
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-ec"]
      args:
        - |
          found=0
          for dev in /dev/dri/renderD*; do
            [ -c "$dev" ] || continue
            found=1
            stat -c 'render node: %n major:minor=%t:%T uid:gid=%u:%g mode=%a' "$dev"
            cat "/sys/class/drm/${dev##*/}/dev"
          done
          test "$found" -eq 1
          exec sleep 3600
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        limits:
          gpu.intel.com/i915: 1
